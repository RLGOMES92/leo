<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>São Luís Imports | Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');
        
        :root {
            --bg-pastel: #F3F6F4;
            --texto-dark: #1A1A1A;
            --nike-color: #00d2ff;
            --oakley-color: #ff9d00;
            --lacoste-color: #00ff88;
            --times-color: #ffffff;
            --destaque-color: #39ff14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-pastel); 
            color: var(--texto-dark); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        .font-modern { font-family: 'Syncopate', sans-serif; }

        /* EFEITO FLICKER NEON */
        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { text-shadow: var(--shadow); }
            20%, 24%, 55% { text-shadow: none; }
        }

        #marca-titulo {
            transition: all 0.5s ease;
            animation: flicker 3s infinite alternate;
        }

        /* SLIDER FULL SCREEN */
        .hero-section { position: relative; height: 100vh; width: 100%; background: #000; overflow: hidden; }
        .hero-slide { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.2s ease-in-out; z-index: 1; }
        .hero-slide.active { opacity: 1; z-index: 2; }
        .hero-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); }

        /* ABAS DE CATEGORIA */
        .btn-aba {
            padding: 12px 24px; border-radius: 50px; font-size: 10px; font-weight: 800;
            text-transform: uppercase; transition: 0.3s; background: white; 
            color: #999; box-shadow: 0 5px 15px rgba(0,0,0,0.05); white-space: nowrap;
        }
        .btn-aba.active { background: var(--texto-dark); color: white; transform: scale(1.1); }

        /* VITRINE ADAPTADA MOBILE/DESKTOP */
        .vitrine-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            padding: 15px; 
        }
        @media (min-width: 768px) { .vitrine-grid { grid-template-columns: repeat(4, 1fr); gap: 25px; } }

        .card-produto {
            background: white; border-radius: 25px; padding: 20px; 
            border: 1px solid rgba(0,0,0,0.02); transition: 0.4s;
            text-align: center;
        }
        .card-produto:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }

        /* COMPONENTES FIXOS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .sidebar-cart { position: fixed; right: 0; top: 0; height: 100%; width: 100%; max-width: 450px; background: white; z-index: 8000; transform: translateX(100%); transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 7500; display: none; }
        .btn-whatsapp { position: fixed; bottom: 25px; right: 25px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; z-index: 5000; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        footer { 
            padding: 50px 20px; background: #000; text-align: center; margin-top: auto; width: 100%; border-top: 3px solid var(--destaque-color);
        }
        footer h2 { color: var(--destaque-color); text-shadow: 0 0 15px var(--destaque-color); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>

    <a href="https://wa.me/5598991234567" target="_blank" class="btn-whatsapp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <header class="fixed w-full top-0 z-[6000] py-8 px-6 md:px-10 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
        <h2 class="font-modern text-[10px] tracking-[6px] text-white">SÃO LUÍS IMPORTS</h2>
        <button onclick="toggleCart()" class="text-white relative">
            <i class="fas fa-shopping-bag text-2xl"></i>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-green-500 h-5 w-5 rounded-full flex items-center justify-center text-[9px] font-black">0</span>
        </button>
    </header>

    <section class="hero-section">
        <div class="hero-slide active">
            <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?w=1920" class="hero-img">
            <div class="absolute inset-0 flex flex-col justify-center items-center">
                <h1 class="font-modern text-6xl md:text-9xl text-white" style="text-shadow: 0 0 20px var(--destaque-color)">HYPE</h1>
            </div>
        </div>
        <div class="hero-slide">
            <img src="https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=1920" class="hero-img">
            <div class="absolute inset-0 flex flex-col justify-center items-center">
                <h1 class="font-modern text-6xl md:text-9xl text-white" style="text-shadow: 0 0 20px var(--nike-color)">DROP</h1>
            </div>
        </div>
    </section>

    <main class="py-16 px-4 container mx-auto">
        <div class="flex overflow-x-auto gap-4 mb-12 pb-6 no-scrollbar justify-start md:justify-center">
            <button onclick="mudarMarca('Destaques', this)" class="btn-aba active">🔥 Destaques</button>
            <button onclick="mudarMarca('Nike', this)" class="btn-aba">Nike</button>
            <button onclick="mudarMarca('Oakley', this)" class="btn-aba">Oakley</button>
            <button onclick="mudarMarca('Lacoste', this)" class="btn-aba">Lacoste</button>
            <button onclick="mudarMarca('Times', this)" class="btn-aba">Times</button>
        </div>

        <h2 id="marca-titulo" class="text-center font-modern text-3xl md:text-6xl mb-16 italic uppercase tracking-tighter">DESTAQUES</h2>

        <div id="vitrine" class="vitrine-grid"></div>
    </main>

    <div id="modal-produto" class="modal">
        <div class="modal-content bg-white p-12 rounded-[40px] text-center w-[90%] max-w-[420px] shadow-2xl">
            <h3 id="modal-nome" class="font-modern text-sm mb-2 uppercase">PRODUTO</h3>
            <p id="modal-preco-view" class="text-3xl font-black mb-8 italic">R$ 0,00</p>
            <p class="text-[10px] uppercase font-bold opacity-30 mb-4 tracking-widest">Selecione o Tamanho</p>
            <div id="grid-tamanhos" class="flex flex-wrap justify-center gap-3 mb-10"></div>
            <button onclick="confirmarCompra()" class="w-full py-5 bg-black text-white rounded-2xl font-black uppercase text-xs tracking-[2px] shadow-xl hover:bg-green-600 transition">Adicionar à Bag</button>
            <button onclick="fecharModal()" class="mt-6 text-[10px] uppercase font-bold opacity-30 block w-full">Cancelar</button>
        </div>
    </div>

    <div id="carrinho" class="sidebar-cart p-10">
        <div class="flex justify-between items-center mb-10 border-b pb-6">
            <span class="font-modern text-sm tracking-widest">MEU CARRINHO</span>
            <button onclick="toggleCart()" class="text-4xl">&times;</button>
        </div>
        
        <div id="lista-bag" class="flex-1 overflow-y-auto space-y-6 no-scrollbar"></div>

        <div class="py-6 border-t border-gray-100">
            <p class="text-[10px] uppercase font-black mb-3 opacity-30">Simular Frete</p>
            <div class="flex gap-2">
                <input type="text" id="cep-input" placeholder="00000-000" class="flex-1 bg-gray-50 border-none rounded-xl px-4 py-3 text-xs outline-none">
                <button onclick="calcularFrete()" class="bg-black text-white px-6 rounded-xl text-[10px] font-bold uppercase">Ok</button>
            </div>
            <div id="resultado-frete" class="hidden mt-3 p-3 bg-green-50 rounded-xl text-green-700 text-[10px] font-bold text-center">Frete Grátis para São Luís!</div>
        </div>

        <div class="pt-8 border-t">
            <div class="flex justify-between text-3xl font-black italic mb-8">
                <span class="text-[10px] uppercase opacity-30 self-center not-italic tracking-[4px]">Total</span>
                <span id="total-val" class="text-black">R$ 0,00</span>
            </div>
            <button onclick="finalizarWhatsApp()" class="w-full py-6 bg-black text-white font-black uppercase rounded-2xl shadow-2xl hover:bg-green-500 transition">Finalizar Pedido</button>
        </div>
    </div>

    <footer>
        <h2 class="font-modern text-lg tracking-[12px] mb-4">SÃO LUÍS IMPORTS</h2>
        <p class="text-[10px] tracking-[4px] mb-2 text-white">A MAIOR DE SÃO PAULO</p>
        <p class="text-[9px] opacity-40 text-white uppercase">Instagram: @saoluisimports_oficial | (98) 99123-4567</p>
    </footer>

    <script>
        const configMarcas = {
            'Destaques': { color: '#39ff14', shadow: '0 0 15px #39ff14, 0 0 30px #39ff14' },
            'Nike': { color: '#00d2ff', shadow: '0 0 15px #00d2ff, 0 0 30px #00d2ff' },
            'Oakley': { color: '#ff9d00', shadow: '0 0 15px #ff9d00, 0 0 30px #ff9d00' },
            'Lacoste': { color: '#00ff88', shadow: '0 0 15px #00ff88, 0 0 30px #00ff88' },
            'Times': { color: '#ffffff', shadow: '0 0 15px #ffffff, 0 0 30px #ffffff' }
        };

        const estoque = {
            Nike: [
                { nome: 'Air Max TN Plus', preco: 950, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600', tam: ['38','39','40','41','42','43'] },
                { nome: 'Dunk Low Panda', preco: 850, img: 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600', tam: ['37','38','39','40'] },
                { nome: 'Air Force 1 White', preco: 750, img: 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600', tam: ['34','35','36','37','38'] },
                { nome: 'Shox R4 Mola', preco: 890, img: 'https://images.unsplash.com/photo-1584735175315-9d5df23860e6?w=600', tam: ['38','39','40','41'] }
            ],
            Oakley: [
                { nome: 'Oakley Romeo 2.0', preco: 1750, img: 'https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=600', tam: ['Único'] },
                { nome: 'Oakley Flak 2.0 XL', preco: 1200, img: 'https://images.unsplash.com/photo-1625591339768-4c28218086a5?w=600', tam: ['Único'] }
            ],
            Lacoste: [
                { nome: 'Polo Lacoste Sport', preco: 450, img: 'https://images.unsplash.com/photo-1628911774602-74a0cfee9b0d?w=600', tam: ['2','3','4','5','6'] },
                { nome: 'Boné Lacoste Croc', preco: 220, img: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=600', tam: ['Único'] }
            ],
            Times: [
                { nome: 'Brasil Home 2026', preco: 349, img: 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=600', tam: ['P','M','G','GG'] },
                { nome: 'Real Madrid 24/25', preco: 349, img: 'https://images.unsplash.com/photo-1614632537190-23e414dcb039?w=600', tam: ['P','M','G','GG'] }
            ]
        };

        let sacola = [];
        let pSelecionado = null;
        let tSelecionado = "";

        function mudarMarca(marca, btn) {
            document.querySelectorAll('.btn-aba').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const titulo = document.getElementById('marca-titulo');
            const conf = configMarcas[marca];
            
            titulo.innerText = marca.toUpperCase();
            titulo.style.color = conf.color;
            titulo.style.setProperty('--shadow', conf.shadow);

            const vitrine = document.getElementById('vitrine');
            vitrine.innerHTML = "";
            let lista = (marca === 'Destaques') ? Object.values(estoque).flat() : estoque[marca];
            
            lista.forEach(p => {
                const card = document.createElement('div');
                card.className = "card-produto";
                card.innerHTML = `
                    <img src="${p.img}" class="h-32 md:h-44 w-full object-contain mb-6">
                    <h4 class="text-[10px] font-bold uppercase truncate">${p.nome}</h4>
                    <p class="text-xl font-black italic mb-4" style="color:${conf.color}">R$ ${p.preco}</p>
                    <button onclick="abrirModal('${p.nome}')" class="w-full py-3 bg-gray-50 rounded-2xl text-[9px] font-black uppercase hover:bg-black hover:text-white transition">Escolher</button>
                `;
                vitrine.appendChild(card);
            });
        }

        function abrirModal(nome) {
            pSelecionado = Object.values(estoque).flat().find(x => x.nome === nome);
            tSelecionado = "";
            document.getElementById('modal-nome').innerText = pSelecionado.nome;
            document.getElementById('modal-preco-view').innerText = `R$ ${pSelecionado.preco}`;
            document.getElementById('grid-tamanhos').innerHTML = pSelecionado.tam.map(t => `<button onclick="tSelecionado='${t}'; document.querySelectorAll('.tam-btn').forEach(b=>b.classList.remove('selected')); this.classList.add('selected')" class="tam-btn border-2 border-gray-100 p-3 rounded-xl min-w-[60px] font-bold transition-all">${t}</button>`).join('');
            document.getElementById('modal-produto').style.display = 'flex';
        }

        function fecharModal() { document.getElementById('modal-produto').style.display = 'none'; }

        function confirmarCompra() {
            if(!tSelecionado) return alert("Selecione o tamanho!");
            sacola.push({...pSelecionado, tamanho: tSelecionado});
            atualizarBag();
            fecharModal();
            toggleCart();
        }

        function atualizarBag() {
            const lista = document.getElementById('lista-bag');
            let total = 0;
            lista.innerHTML = sacola.map((i, idx) => {
                total += i.preco;
                return `<div class="flex gap-4 items-center bg-gray-50 p-5 rounded-3xl border">
                    <img src="${i.img}" class="w-14 h-14 object-cover rounded-xl">
                    <div class="flex-1">
                        <p class="text-[10px] font-black uppercase">${i.nome}</p>
                        <p class="text-[11px] font-bold text-green-600">TAM: ${i.tamanho} | R$ ${i.preco}</p>
                    </div>
                    <button onclick="sacola.splice(${idx},1); atualizarBag()"><i class="fas fa-times text-gray-400"></i></button>
                </div>`;
            }).join('');
            document.getElementById('total-val').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('cart-count').innerText = sacola.length;
        }

        function toggleCart() {
            const c = document.getElementById('carrinho');
            const o = document.getElementById('cart-overlay');
            const estaAberto = c.style.transform === "translateX(0%)";
            c.style.transform = estaAberto ? "translateX(100%)" : "translateX(0%)";
            o.style.display = estaAberto ? "none" : "block";
        }

        function calcularFrete() { 
            if(document.getElementById('cep-input').value.length > 7) 
                document.getElementById('resultado-frete').classList.remove('hidden'); 
        }

        function finalizarWhatsApp() {
            if(sacola.length === 0) return alert("Sua bag está vazia!");
            let msg = "*NOVO PEDIDO - SÃO LUÍS IMPORTS*\n\n";
            sacola.forEach(i => msg += `• ${i.nome} - Tam: ${i.tamanho} (R$ ${i.preco})\n`);
            msg += `\n*TOTAL:* ${document.getElementById('total-val').innerText}`;
            window.open(`https://wa.me/5598991234567?text=${encodeURIComponent(msg)}`);
        }

        setInterval(() => {
            const slides = document.querySelectorAll('.hero-slide');
            const active = document.querySelector('.hero-slide.active');
            active.classList.remove('active');
            let next = active.nextElementSibling || slides[0];
            next.classList.add('active');
        }, 5000);

        mudarMarca('Destaques', document.querySelector('.btn-aba'));
    </script>
</body>
</html>
